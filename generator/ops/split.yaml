op: split
name: Split
dropSignatures: true
doc: It splits each document into several.
variants:
  - name: Every
    doc: Every document is split into chunks of every pages.
    fields:
      - { name: Every, form: every, type: int, required: true, min: 1, example: "2" }
  - name: Ranges
    doc: Every document is split into one document per page selection, such as "1-3", "4" or "5,7".
    fields:
      - { name: Ranges, form: ranges, type: json, goType: "[]string", required: true, variadic: true, example: '[]string{"1-3", "4"}' }
