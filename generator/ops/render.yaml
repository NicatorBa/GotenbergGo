op: render
name: Render
doc: It draws the pages of each document as images, added to the outputs. As a stage, it must come last.
fields:
  - name: Pages
    form: pages
    type: string
    example: "1-3"
    doc: Selects the drawn pages, such as "1-3,5", "odd" or "last"; all pages by default.
  - name: DPI
    form: dpi
    type: int
    min: 1
    example: "150"
    doc: Sets the resolution of the images.
  - name: Format
    form: format
    type: enum
    enum: RenderFormat
    doc: Sets the image format. The server default is png.
  - name: Quality
    form: quality
    type: int
    min: 1
    max: 100
    example: "80"
    doc: Sets the JPEG quality from 1 to 100, for RenderFormatJPEG only. The server default is 100.
