# Options shared by the stamp-text, stamp-image and stamp-pdf operations.
fields:
  - name: Pages
    form: pages
    type: string
    example: "1-3"
    doc: Selects the stamped pages, such as "1-3,5", "odd" or "last"; all pages by default.
  - name: X
    form: x
    type: float
    example: "72"
    doc: Sets the horizontal position in points from the left edge, or the offset from Position when it is set.
  - name: Y
    form: "y"
    type: float
    example: "72"
    doc: Sets the vertical position in points from the bottom edge, or the offset from Position when it is set.
  - name: Position
    form: position
    type: enum
    enum: StampPosition
    doc: Anchors the stamp on the page; X and Y are then offsets from it.
  - name: Opacity
    form: opacity
    type: float
    min: 0
    max: 1
    doc: Sets the opacity, from 0 to 1.
  - name: Rotation
    form: rotation
    type: float
    example: "45"
    doc: Sets the rotation in degrees.
